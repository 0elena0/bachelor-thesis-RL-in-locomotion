# v3 on A1, flat ground, RFI at the physics rate


name: erfi_study_a1_v3_substep
out: erfi_study_a1_v3_substep_l2.5
conditions:
- rfi
- erfi_c
- erfi_50
seeds:
- 0
- 1
- 2
train:
  robot: a1
  task: flat_terrain
  num_timesteps: 300_000_000
  num_evals: 15
  history_len: 7
  policy_layers:
  - 512
  - 512
  value_layers:
  - 512
  - 256
  - 128
  symmetric_critic: false
  rfi_lim: 2.5
  rao_lim: 2.5
  impl: warp
  env_overrides:
    history_target_error: true
    erfi.per_substep: true
eval:
  impl: jax
  n_episodes: 50
  duration_s: 8.0
  success_distance_m: 2.5
  command:
  - 0.5
  - 0.0
  - 0.0
  push_start_s: 1.0
  push_duration_s: 3.0
  params:
  - payload_kg
  - push_N
  - friction
  - gravity
  - kp_scale
