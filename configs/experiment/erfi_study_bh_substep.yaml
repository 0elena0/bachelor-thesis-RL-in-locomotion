  task: flat_terrain
  num_timesteps: 200_000_000
  num_evals: 10
  history_len: 7
  policy_layers:
  - 512
  - 512
  value_layers:
  - 512
  - 256
  - 128
  symmetric_critic: false
  rfi_lim:
  - 3.032
  - 2.052
  - 2.359
  - 3.717
  - 2.863
  - 0.158
